name: PRIME Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/prime-mobile-apk.yml'

permissions:
  contents: write

concurrency:
  group: prime-mobile-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    defaults:
      run:
        working-directory: mobile
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android components
        run: sdkmanager 'platform-tools' 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Install application dependencies
        run: npm ci
      - name: Read mobile release version
        run: |
          APP_VERSION="$(node -e 'process.stdout.write(require("./package.json").version)')"
          ANDROID_VERSION_CODE="$(node -e 'process.stdout.write(String(require("./app.json").expo.android.versionCode))')"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$ANDROID_VERSION_CODE" >> "$GITHUB_ENV"
      - name: Check source and session isolation
        run: |
          npm run typecheck
          npm run lint
          npm test
      - name: Generate native Android application
        run: npx expo prebuild --platform android --no-install
      - name: Build standalone APK
        working-directory: mobile/android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --build-cache --max-workers=3 -Pkotlin.compiler.execution.strategy=in-process --console=plain
      - name: Verify signature, package and embedded application
        run: |
          set -eu
          apk=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$apk" | grep -F "package: name='it.primegestionale.mobile'"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$apk" | grep -F "versionCode='${ANDROID_VERSION_CODE}' versionName='${APP_VERSION}'"
          unzip -l "$apk" | grep -F 'assets/index.android.bundle'
          mkdir -p release
          cp "$apk" "release/PRIME-Mobile-Android-v${APP_VERSION}.apk"
          (cd release && sha256sum "PRIME-Mobile-Android-v${APP_VERSION}.apk" > SHA256SUMS.txt)
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test native mobile screens on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: cd mobile && python3 tests/android-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PRIME-Mobile-Android-v${{ env.APP_VERSION }}
          path: mobile/release/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish downloadable APK alongside Authenticator
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="mobile-android-v${APP_VERSION}"
          cat > release/notes.md <<NOTES
          PRIME Mobile ${APP_VERSION} — app Android nativa PRIME.

          Logo di avvio ridisegnato ad alta risoluzione e integrato con lo sfondo; loghi provider inclusi nell’app; menu diviso in categorie come il sito; palette VIP corretta; anteprime stagionali disponibili nella demo; sezioni dedicate nascoste fino all’attivazione del servizio; pagamenti Stripe dimostrativi, senza collegamento o richieste reali.

          App nativa React Native senza WebView. Include Vanessa Copilot e il flusso operativo testuale/vocale, Stripe con dati demo e funzioni Live, Wallester con grafici e movimenti, gestione carte e simulazioni di pagamento dimostrative.

          Le operazioni Live Wallester richiedono che il gestionale esponga le API di catalogo, preparazione ed esecuzione. Le simulazioni demo restano locali e non trasferiscono denaro. Le funzioni che dipendono da provider o API non disponibili sono indicate nell’app.

          L’APK è firmato con la chiave di sviluppo del progetto; non è una distribuzione Google Play. Gli acquisti reali attendono account store, prodotti e verifica server dei pagamenti.

          L’app Authenticator già presente nel repository rimane separata e le sue release non vengono modificate.
          NOTES
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "release/PRIME-Mobile-Android-v${APP_VERSION}.apk" release/SHA256SUMS.txt release/*.png --clobber
          else
            gh release create "$tag" "release/PRIME-Mobile-Android-v${APP_VERSION}.apk" release/SHA256SUMS.txt release/*.png --target "$GITHUB_SHA" --title "PRIME Mobile Android ${APP_VERSION}" --notes-file release/notes.md --prerelease --latest=false
          fi
