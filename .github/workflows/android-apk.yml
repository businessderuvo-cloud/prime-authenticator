name: Build native Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'android-v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build components
        run: sdkmanager "platform-tools" "emulator" "platforms;android-36" "build-tools;36.0.0" "system-images;android-36;google_apis_playstore;x86_64"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Configure release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.PRIME_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PRIME_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -eu
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          key_store="$RUNNER_TEMP/prime-authenticator-release.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_store"
          key_info="$(keytool -list -v -keystore "$key_store" -storetype PKCS12 -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>/dev/null)"
          key_alias="$(printf '%s\n' "$key_info" | sed -n 's/^Alias name: //p' | head -n 1)"
          certificate_sha256="$(printf '%s\n' "$key_info" | sed -n 's/.*SHA256: //p' | head -n 1 | tr -d ':')"
          expected_sha256='34B0A0DBF3BECB281611424FF1CFF481AD03173B93A6D6AEB5021566A5174E19'
          test -n "$key_alias"
          test "$certificate_sha256" = "$expected_sha256"
          echo "ANDROID_KEYSTORE_PATH=$key_store" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$key_alias" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "Using the configured PRIME Android release certificate ($certificate_sha256)."

      - name: Build native APK and security tests
        working-directory: android
        run: gradle --no-daemon :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Verify APK signature and native launcher
        shell: bash
        run: |
          set -eu
          apk='android/app/build/outputs/apk/release/app-release.apk'
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -F "package: name='it.primegestionale.authenticator' versionCode='7' versionName='1.0.0'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -F "launchable-activity: name='it.primegestionale.authenticator.MainActivity'"

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 600
          disable-animations: true
          script: bash ci/native-smoke.sh

      - name: Publish APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: prime-authenticator-android-v1.0.0
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
